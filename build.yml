name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find app folder and check version
        id: find
        run: |
          echo "All copies of capacitor.config.json in this repository:"
          find . -name capacitor.config.json -not -path "*/node_modules/*"
          CONFIG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$CONFIG" ]; then
            echo "ERROR: capacitor.config.json not found. Upload the project files (www, assets, package.json, capacitor.config.json) to the repository."
            exit 1
          fi
          DIR=$(dirname "$CONFIG")
          echo "-----------------------------------------"
          echo "USING APP FOLDER: $DIR"
          VERSION=$(grep -o 'class="ver">v[0-9.]*' "$DIR/www/index.html" | head -1 || true)
          echo "APP VERSION IN www/index.html: ${VERSION:-NONE}"
          echo "-----------------------------------------"
          if [ -z "$VERSION" ]; then
            echo "ERROR: This www/index.html is an OLD version (no version marker). Replace www/index.html in the repository with the new one, then run the build again."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Use fixed signing key (so app updates keep your data)
        run: |
          mkdir -p ~/.android
          if [ -f "${{ steps.find.outputs.dir }}/debug.keystore" ]; then
            cp "${{ steps.find.outputs.dir }}/debug.keystore" ~/.android/debug.keystore
            echo "Using debug.keystore from the repository"
          else
            echo "debug.keystore not found, using a temporary key"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install

      - name: Create Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap add android

      - name: Make app icons (optional step)
        continue-on-error: true
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Copy web app into Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap sync android

      - name: Confirm the new app is inside the Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: grep -o 'class="ver">v[0-9.]*' android/app/src/main/assets/public/index.html

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-apk-v3-3
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
